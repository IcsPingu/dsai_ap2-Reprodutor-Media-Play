<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<style>
body{font:16px system-ui;color:#ecf6ff;background:#112337;margin:0;padding:14px}
audio{width:100%;margin:12px 0}button,select{padding:10px;margin:4px;color:#fff;background:#214767;border:1px solid #76baff;border-radius:6px;font:inherit}
button:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:2px}
#title{overflow-wrap:anywhere}#status{min-height:24px}button:disabled{opacity:.5}
</style>
<div id="title">Selecione uma faixa na biblioteca</div>
<audio id="audio" controls preload="metadata" aria-label="Reprodutor de áudio"></audio>
<div>
<button id="previous" type="button">Anterior</button>
<button id="stop" type="button">Parar</button>
<button id="next" type="button">Próxima</button>
<button id="shuffle" type="button" aria-pressed="false">Aleatório</button>
<label>Repetir <select id="repeat"><option value="off">Desligado</option><option value="all">Todas</option><option value="one">Uma</option></select></label>
</div>
<div id="status" role="status" aria-live="polite">Pronto</div>
<script>
const audio=document.getElementById('audio');
const title=document.getElementById('title');
const status=document.getElementById('status');
const repeat=document.getElementById('repeat');
let tracks=[], original=[], index=-1, command=-1, sequence=0, applying=false, shuffled=false;
function send(type, data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},'*');}
function report(state){
  send('streamlit:setComponentValue',{value:{sequence:++sequence,command,id:tracks[index]?.id,position:audio.currentTime||0,status:state,repeat:repeat.value},dataType:'json'});
}
async function start(){
  try {await audio.play();}
  catch(error){status.textContent='Clique em Play no controle de áudio para iniciar. '+error.message;report('paused');}
}
function select(next, play=true, position=0){
  if(next<0||next>=tracks.length)return;
  applying=true;
  index=next;
  title.textContent=tracks[index].title;
  audio.src=tracks[index].src;
  audio.onloadedmetadata=()=>{
    audio.currentTime=Math.min(Math.max(position,0),audio.duration||0);
    applying=false;
    if(play)start(); else report('paused');
  };
  audio.load();
}
function advance(automatic=false){
  if(automatic&&repeat.value==='one'){audio.currentTime=0;start();return;}
  if(index+1<tracks.length)select(index+1);
  else if(repeat.value==='all'&&tracks.length)select(0);
  else {audio.pause();status.textContent='Fim da fila';report('stopped');}
}
document.getElementById('next').onclick=()=>advance();
document.getElementById('previous').onclick=()=>{
  if(audio.currentTime>3){audio.currentTime=0;return;}
  select(index>0?index-1:(repeat.value==='all'?tracks.length-1:0));
};
document.getElementById('stop').onclick=()=>{audio.pause();audio.currentTime=0;status.textContent='Parado';report('stopped');};
repeat.onchange=()=>report(audio.paused?'paused':'playing');
document.getElementById('shuffle').onclick=(event)=>{
  const current=tracks[index]?.id;
  shuffled=!shuffled;
  event.target.setAttribute('aria-pressed',String(shuffled));
  tracks=[...original];
  if(shuffled){
    for(let i=tracks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[tracks[i],tracks[j]]=[tracks[j],tracks[i]];}
  }
  index=tracks.findIndex(t=>t.id===current);
};
audio.onended=()=>advance(true);
audio.onplay=()=>{status.textContent='Reproduzindo';if(!applying)report('playing');};
audio.onplaying=()=>{status.textContent='Reproduzindo';};
audio.onpause=()=>{if(!applying&&!audio.ended){status.textContent='Pausado';report('paused');}};
audio.onseeked=()=>{if(!applying)report(audio.paused?'paused':'playing');};
audio.onerror=()=>{status.textContent='Não foi possível reproduzir este arquivo neste navegador.';report('error');};
audio.onwaiting=()=>{status.textContent='Carregando áudio…';};
window.addEventListener('message',event=>{
  if(event.source!==window.parent||event.data.type!=='streamlit:render')return;
  const args=event.data.args;
  if(args.command===command)return;
  command=args.command;
  original=args.queue;
  tracks=[...original];
  shuffled=false;
  document.getElementById('shuffle').setAttribute('aria-pressed','false');
  index=tracks.findIndex(t=>t.id===args.selected);
  audio.volume=Math.min(1,Math.max(0,args.volume));
  repeat.value=args.repeat;
  for(const id of ['previous','next','stop','shuffle'])document.getElementById(id).disabled=!tracks.length;
  if(index>=0)select(index,args.playing,args.position);
  else{applying=true;audio.pause();audio.removeAttribute('src');audio.load();applying=false;}
  send('streamlit:setFrameHeight',{height:250});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:250});
</script>
</html>
